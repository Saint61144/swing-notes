<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swing Notes</title>
  <link rel="icon" href="assets/icon32.png">
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <div class="brand"><img src="assets/icon48.png" width="25" height="25" alt=""> Swing Notes</div>
    <div class="scene" aria-hidden="true"><img src="assets/icon128.png" width="91" height="91" alt=""></div>
    <h1>Export this <em>DM.</em></h1>
    <p id="description">Open a Discord DM in this tab to get started.</p>
    <section id="controls" hidden aria-label="Choose whose messages to export">
      <div class="choices">
        <button type="button" data-mode="theirs">Their messages</button>
        <button type="button" data-mode="mine">My messages</button>
        <button type="button" data-mode="both">Both sides <span aria-hidden="true">↓</span></button>
      </div>
      <details id="account">
        <summary>Check your display name</summary>
        <label for="my-name">Your name as shown in this DM</label>
        <input type="text" id="my-name" autocomplete="off" spellcheck="false" maxlength="80">
      </details>
    </section>
    <section id="progress-area" hidden aria-label="Export progress">
      <div class="progress-label"><span id="stage"></span><b id="count"></b></div>
      <progress id="progress" max="100" aria-label="Message export progress"></progress>
      <p id="note"></p>
      <div class="actions">
        <button type="button" id="stop" hidden>Stop</button>
        <button type="button" id="partial" hidden>Download what was found</button>
      </div>
    </section>
    <p id="feedback" role="status" aria-live="polite" hidden></p>
  </main>
</body>
</html>
